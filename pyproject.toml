[project]
name = "amc-dc419"
version = "0.1.0"
description = "Home Assistant integration for AMC DC419 ceiling fan and light controllers"
requires-python = ">=3.13,<3.15"

[tool.uv]
package = false

[dependency-groups]
dev = [
	"pytest-homeassistant-custom-component>=0.13.0",
	"ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]